<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#46524c"/></marker>
    <style>
      .t{font-size:15px;fill:#1b1d1a}.s{font-size:12.5px;fill:#4a5149}.h{font-size:13px;font-weight:700;letter-spacing:.08em;fill:#1f6f63}
      .cv{fill:#e6f2ef;stroke:#1f6f63;stroke-width:1.5}.aws{fill:#fff4e5;stroke:#d9821e;stroke-width:1.5}.ag{fill:#efeefb;stroke:#5458c2;stroke-width:1.5}
      .pl{fill:#f4f5f2;stroke:#bfc3b8;stroke-width:1.2}.l{stroke:#46524c;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1b1d1a">Spatially Aware Property Inspection: architecture</text>
  <text x="40" y="68" class="s">Teal: OpenCV 5 analysis · Orange: AWS services · Purple: agent (perception → decision → action) · Grey: people and devices</text>

  <!-- AWS cloud boundary -->
  <rect x="250" y="95" width="1120" height="735" rx="16" fill="none" stroke="#d9821e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="270" y="122" class="h" fill="#d9821e">AWS CLOUD (ap-southeast-1)</text>

  <!-- people -->
  <rect x="30" y="160" width="190" height="110" rx="12" class="pl"/>
  <text x="45" y="188" class="t" font-weight="700">Person filming</text>
  <text x="45" y="210" class="s">Phone walkthrough video,</text><text x="45" y="227" class="s">or the Coverage Capture app</text><text x="45" y="244" class="s">(re-film instructions back)</text>
  <rect x="30" y="560" width="190" height="110" rx="12" class="pl"/>
  <text x="45" y="588" class="t" font-weight="700">Inspector</text>
  <text x="45" y="610" class="s">Reviews evidence and the</text><text x="45" y="627" class="s">agent trace; approves or</text><text x="45" y="644" class="s">overrides the decision</text>

  <!-- EC2 -->
  <rect x="280" y="140" width="760" height="560" rx="14" class="aws"/>
  <text x="300" y="168" class="h" fill="#b36612">AMAZON EC2 · GRAVITON (ARM64) · FastAPI web endpoint</text>

  <!-- pipeline boxes -->
  <g>
    <rect x="300" y="185" width="230" height="78" rx="10" class="cv"/><text x="314" y="208" class="t" font-weight="700">1 · Video and quality</text>
    <text x="314" y="228" class="s">VideoCapture, Laplacian sharpness,</text><text x="314" y="244" class="s">DIS optical flow, CLAHE</text>
    <rect x="550" y="185" width="230" height="78" rx="10" class="cv"/><text x="564" y="208" class="t" font-weight="700">2 · Privacy</text>
    <text x="564" y="228" class="s">FaceDetectorYN (YuNet), DB text</text><text x="564" y="244" class="s">detection → blur before analysis</text>
    <rect x="800" y="185" width="225" height="78" rx="10" class="cv"/><text x="814" y="208" class="t" font-weight="700">3 · Camera tracking</text>
    <text x="814" y="228" class="s">LK flow, MAGSAC essential matrix,</text><text x="814" y="244" class="s">recoverPose, triangulate, PnP</text>

    <rect x="300" y="285" width="230" height="78" rx="10" class="cv"/><text x="314" y="308" class="t" font-weight="700">4 · Depth</text>
    <text x="314" y="328" class="s">cv2.dnn: Depth Anything V2 Small</text><text x="314" y="344" class="s">(ONNX, CPU), scaled by tracking</text>
    <rect x="550" y="285" width="230" height="78" rx="10" class="cv"/><text x="564" y="308" class="t" font-weight="700">5 · 3D fusion</text>
    <text x="564" y="328" class="s">cv2.Volume hash TSDF,</text><text x="564" y="344" class="s">fetchPointsNormals, savePointCloud</text>
    <rect x="800" y="285" width="225" height="78" rx="10" class="cv"/><text x="814" y="308" class="t" font-weight="700">6 · Room layout</text>
    <text x="814" y="328" class="s">Manhattan walls, floor, ceiling</text><text x="814" y="344" class="s">from fused points and normals</text>

    <rect x="300" y="385" width="230" height="78" rx="10" class="cv"/><text x="314" y="408" class="t" font-weight="700">7 · Coverage</text>
    <text x="314" y="428" class="s">10 cm samples, projectPoints,</text><text x="314" y="444" class="s">depth occlusion, 3 m / 70° rule</text>
    <rect x="550" y="385" width="230" height="78" rx="10" class="cv"/><text x="564" y="408" class="t" font-weight="700">8 · Defect evidence</text>
    <text x="564" y="428" class="s">ridge filter, thinning, Lab colour,</text><text x="564" y="444" class="s">morphology, contours, size in m</text>
    <rect x="800" y="385" width="225" height="78" rx="10" class="cv"/><text x="814" y="408" class="t" font-weight="700">9 · Walls and labels</text>
    <text x="814" y="428" class="s">homography warps onto wall planes,</text><text x="814" y="444" class="s">text recognition (CRNN) on plates</text>
  </g>
  <path class="l" marker-end="url(#a)" d="M530 224h20M780 224h20M912 263v10H415v12M530 324h20M780 324h20M912 363v10H415v12M530 424h20M780 424h20"/>

  <!-- agent -->
  <rect x="300" y="500" width="725" height="180" rx="12" class="ag"/>
  <text x="318" y="526" class="h" fill="#5458c2">INSPECTION AGENT · perception → decision → action</text>
  <text x="318" y="552" class="s">Tools (each runs OpenCV 5 on the walkthrough): coverage_report · list_candidates · look_at (CLAHE, denoise)</text>
  <text x="318" y="572" class="s">find_better_view (projects the 3D finding into every frame, picks the closest square-on sharp view, re-detects)</text>
  <text x="318" y="592" class="s">measure (depth + intrinsics → metres) · read_label (DB + CRNN) · confirm / dismiss · request_refilm · request_human_approval</text>
  <text x="318" y="620" class="t">What OpenCV measures changes the next step: low coverage → REFER + re-film instructions;</text>
  <text x="318" y="640" class="t">unclear crop → another view; re-detection score → confirm or dismiss; every decision waits for a person.</text>
  <text x="318" y="664" class="s">Rule-based policy runs the same tools when Bedrock is unreachable, so the loop never stalls.</text>
  <path class="l" marker-end="url(#a)" d="M662 463v37"/>

  <!-- AWS services -->
  <rect x="1090" y="160" width="250" height="110" rx="12" class="aws"/>
  <text x="1105" y="188" class="t" font-weight="700">Amazon S3</text>
  <text x="1105" y="210" class="s">Uploaded videos, results,</text><text x="1105" y="227" class="s">3D points, rectified walls,</text><text x="1105" y="244" class="s">agent traces, code bundle</text>
  <rect x="1090" y="520" width="250" height="130" rx="12" class="aws"/>
  <text x="1105" y="548" class="t" font-weight="700">Amazon Bedrock</text>
  <text x="1105" y="570" class="s">Claude via the Converse API</text><text x="1105" y="587" class="s">with tool use and images:</text><text x="1105" y="604" class="s">decides which OpenCV tool</text><text x="1105" y="621" class="s">to call next</text>
  <rect x="1090" y="330" width="250" height="110" rx="12" class="aws"/>
  <text x="1105" y="358" class="t" font-weight="700">IAM + Systems Manager</text>
  <text x="1105" y="380" class="s">Instance role: S3 + Bedrock only;</text><text x="1105" y="397" class="s">no keys on the server; shell</text><text x="1105" y="414" class="s">access without open SSH</text>

  <path class="l" marker-end="url(#a)" d="M220 215h80"/>
  <path class="l" marker-end="url(#a)" d="M1040 215h50"/>
  <path class="l" marker-end="url(#a)" marker-start="url(#a)" d="M1025 585h65"/>
  <path class="l" marker-end="url(#a)" marker-start="url(#a)" d="M300 615H220"/>
  <path class="l" marker-end="url(#a)" d="M300 650c-120 0-150-300-150-380"/>
  <text x="96" y="420" class="s" transform="rotate(-90 96 420)">re-film instructions</text>

  <rect x="280" y="725" width="1060" height="85" rx="12" class="pl"/>
  <text x="300" y="752" class="t" font-weight="700">Web endpoint (same EC2 instance)</text>
  <text x="300" y="774" class="s">Upload a video · watch processing · 3D point cloud (three.js) · rectified walls and floor plan · findings with crops · coverage and gaps ·</text>
  <text x="300" y="792" class="s">step-by-step agent trace with the images it looked at · approve or override the decision (recorded in the trace)</text>
  <path class="l" marker-end="url(#a)" d="M662 700v25"/>
</svg>
